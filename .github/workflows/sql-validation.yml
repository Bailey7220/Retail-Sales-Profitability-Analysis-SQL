name: SQL reproducibility and validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce raw references and validate sales-only analysis
        run: python scripts/analyze_layers.py
      - name: Collect raw-data evidence after a failure
        if: failure()
        run: python scripts/diagnose.py
      - name: Preserve labeled outputs and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-raw-sales-only-and-quarantine
          path: build/
          if-no-files-found: warn
