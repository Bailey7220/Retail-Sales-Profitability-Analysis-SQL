name: SQL reproducibility and validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fixture-based regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository CSVs and execute committed SQL
        run: python scripts/reproduce.py
      - name: Collect evidence after a validation failure
        if: failure()
        run: python scripts/diagnose.py
      - name: Preserve outputs and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-outputs-and-diagnostics
          path: build/
          if-no-files-found: warn
